appId: app.grimoire.desktop
productName: Brewhall
executableName: brewhall
copyright: "Unofficial fan content. Magic: The Gathering is (c) Wizards of the Coast. Card data from Scryfall."
publish:
  provider: github
  owner: itsdommie
  repo: grimoire
  releaseType: draft
  updaterCacheDirName: grimoire-updater

directories:
  output: ../../release
  buildResources: build
files:
  - dist/main.cjs
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: ../../LICENSE
    to: LICENSE.brewhall.txt
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: build/ort
    to: ort
asar: true
compression: normal

linux:
  icon: build/icon.png
  target: [AppImage, deb]
  category: Game
  maintainer: Brewhall contributors <brewhall@localhost>
  synopsis: "Local-first Magic - The Gathering deck lab"
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.png
  target: [{ target: nsis, arch: [x64] }]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
