name: Release

# Push a tag like v0.2.0 (it must match "version" in packages/desktop/package.json) to build, test and publish installers.
# Windows (NSIS) and Linux (AppImage + deb) are built on their own OS, smoke-tested, and attached to one draft release,
# which is published only if both succeed. The files electron-updater needs (latest.yml, latest-linux.yml) are uploaded too.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match the app version
        shell: bash
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match version v$version"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build app bundle
        run: npm run build -w @grimoire/desktop
      - name: Build installers and upload them to the draft release
        run: npx electron-builder --publish always
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # not code-signed yet
      # Test the real artifacts, not the unpacked folders: the Linux AppImage itself, and the Windows installer run for real.
      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          export GRIMOIRE_EXE="$(ls "$GITHUB_WORKSPACE"/release/*.AppImage | head -n 1)"
          chmod +x "$GRIMOIRE_EXE"
          xvfb-run -a npx playwright test -c playwright.desktop.config.ts
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Install and smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release\Grimoire-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $exe = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Grimoire.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw 'Grimoire.exe was not installed' }
          Write-Host "Installed at $exe"
          $env:GRIMOIRE_EXE = $exe
          npx playwright test -c playwright.desktop.config.ts

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -q .body)
          cat > notes.md <<NOTES
          ## Install

          - **Windows:** run \`Grimoire-Setup-*.exe\`. If Windows shows "Windows protected your PC", choose *More info* then *Run anyway* (the app isn't signed with a paid certificate yet).
          - **Linux:** make the \`.AppImage\` executable and run it, or install the \`.deb\`.

          Windows and the AppImage update themselves from here. First launch downloads the card database (about 25 MB) once.

          $generated
          NOTES
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file notes.md
