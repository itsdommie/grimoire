name: Card printings

# Lists every paper printing of every card (set, collector number, finishes, prices) from Scryfall's per-printing file, trimmed to ~4 MB,
# so the app can tell a Sol Ring from CMM from one from Alpha: the scanner records the exact printing, and imports match set codes.
# It lives on a PRERELEASE tagged "card-printings": a normal release would become "latest" and break the auto-updater and the
# download page, which both read the latest release. A small manifest is published too, so the app only downloads the big file when
# the version changes.
on:
  schedule:
    - cron: '23 5 * * 3' # Wednesdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-printings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the list from Scryfall's Default Cards
        run: npx tsx src/cli.ts printings --export "$RUNNER_TEMP/printings"
        working-directory: packages/server
      - name: Publish to the card-printings prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view card-printings >/dev/null 2>&1 || gh release create card-printings \
            --prerelease --latest=false --title "Card printings (rolling)" \
            --notes "Every paper printing of every card, used by Grimoire's scanner and imports. Rebuilt weekly by the Card printings workflow. Not an application release."
          # The big file first, then the manifest that points to it, so a reader never sees a manifest whose file isn't there yet.
          gh release upload card-printings "$RUNNER_TEMP"/printings/card-printings.json.gz --clobber
          gh release upload card-printings "$RUNNER_TEMP"/printings/card-printings.json --clobber
